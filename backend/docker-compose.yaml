
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: always
    volumes:
      - ./data/postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - 5432:5432
    deploy:
      resources:
        limits:
          cpus: 0.2
          memory: 128m

  neo4j:
    image: neo4j:2025.08-community-ubi9
    restart: always
    volumes:
        - ./data/neo4j/logs:/logs
        - ./data/neo4j/config:/config
        - ./data/neo4j/data:/data
        - ./data/neo4j/plugins:/plugins
    environment:
        - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
        - NEO4J_PLUGINS='["graph-data-science"]'
        - NEO4J_db_logs_query_enabled=VERBOSE
        - NEO4J_db_logs_query_transaction_enabled=VERBOSE
        - NEO4J_db_logs_query_parameter__logging__enabled=true
        - NEO4J_dbms_logs_http_enabled=true
        - NEO4J_server_logs_debug_enabled=true
    ports:
        - "7474:7474"
        - "7687:7687"

  redis:
    image: redislabs/redismod
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis_data:/data