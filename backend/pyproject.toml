[project]
name = "Invoice Chatbot Backend"
version = "0.1.0"
description = "AI-powered invoice knowledge graph and chat interface"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.21.0",
    "boto3>=1.40.43",
    "botocore>=1.40.43",
    "cocoindex==0.2.14",
    "docling>=2.55.1",
    "fastapi[standard]>=0.118.0",
    "grandalf>=0.8",
    "langchain-google-genai>=2.1.12",
    "langchain-neo4j>=0.5.0",
    "langgraph>=0.6.10",
    "langgraph-checkpoint-sqlite>=2.0.11",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.11.9",
    "pytest>=9.0.1",
    "python-dotenv==1.1.1",
    "redis>=7.0.1",
    "ruff>=0.14.5",
    "sqlalchemy>=2.0.44",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.24.0",
]
dev = [
    "mypy>=1.5.0",
    "black>=23.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
extend-select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "W",  # pycodestyle warnings
    "C",  # complexity-related
    "B",  # bugbear
    "I",  # import formatting (isort-like)
]
extend-ignore = ["E203"]
exclude = [
    "neo4j/**",
    "postgres_data/**",
    "redis_data/**",
    "**/node_modules/**",
]
